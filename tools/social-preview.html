<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
  <style>
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
    body {
      background: radial-gradient(900px 500px at 85% 40%, rgba(94, 234, 212, 0.12), transparent 60%), #0f1115;
      color: #e8eaed; font-family: Inter, sans-serif;
      display: flex; align-items: center; padding: 0 72px; box-sizing: border-box; gap: 56px;
    }
    .text { flex: 1; }
    .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 700; }
    .brand img { width: 64px; height: 64px; }
    h1 { font-size: 60px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; margin: 28px 0 22px; }
    h1 em { font-style: normal; color: #5eead4; }
    .tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .tags span {
      font-size: 20px; font-weight: 500; color: #9aa0a6; padding: 8px 14px; border-radius: 8px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .shot { height: 540px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../assets/icon.png" alt="">All You Need</div>
    <h1>League of Legends overlay.<br><em>Free &amp; open source.</em></h1>
    <div class="tags">
      <span>Exact CS</span><span>Summoner timers</span><span>Mana for your combo</span>
      <span>Gold to next item</span><span>Auto runes</span>
    </div>
  </div>
  <img class="shot" src="../docs/panel-en.png" alt="">
</body>
</html>
